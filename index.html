<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AzLove Match</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card-container">
        <div class="profile-card">
            <!-- Müvəqqəti test şəkli -->

            <div class="profile-info">
                <h2>Aysu, 23 <span>📍 Bakı</span></h2>
                <p>Kitab oxumağı, şəkil çəkməyi və yeni kafelər kəşf etməyi sevirəm.</p>
            </div>
        </div>
        <div class="actions">
            <button id="btn-pass" class="btn pass">👎 Keç</button>
            <button id="btn-like" class="btn like">👍 Bəyən</button>
        </div>
    </div>
</body>
</html>
