<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AzLove Match</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card-container">
        <div class="profile-card">
            <img src="https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="Profil Şəkli" class="profile-img">
            <div class="profile-info">
                <h2 id="user-name-age">Aysu, 23 <span id="user-city">📍 Bakı</span></h2>
                <p id="user-bio">Kitab oxumağı, şəkil çəkməyi və yeni kafelər kəşf etməyi sevirəm.</p>
            </div>
        </div>
        <div class="actions">
            <button id="btn-pass" class="btn pass">👎 Keç</button>
            <button id="btn-like" class="btn like">👍 Bəyən</button>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="app.js"></script>
</body>
</html>
</body>
</html>
